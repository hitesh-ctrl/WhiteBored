# Local full stack: Postgres, one-off migration, socket server and web app.
# Set the values below in your shell or an env file; nothing secret is stored here.
#   POSTGRES_PASSWORD=choose-one docker compose up --build
name: whiteboard
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: whiteboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: whiteboard
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whiteboard"]
      interval: 3s
      retries: 20

  migrate:
    build: { context: ., target: migrate }
    environment:
      DATABASE_URL: postgresql://whiteboard:${POSTGRES_PASSWORD}@db:5432/whiteboard
    depends_on: { db: { condition: service_healthy } }
    restart: "no"

  socket:
    build: { context: ., target: socket }
    environment:
      DATABASE_URL: postgresql://whiteboard:${POSTGRES_PASSWORD}@db:5432/whiteboard
      SOCKET_PORT: "4000"
      CORS_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
    ports: ["${SOCKET_HOST_PORT:-4000}:4000"]
    depends_on: { migrate: { condition: service_completed_successfully } }

  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_SOCKET_URL: ${SOCKET_PUBLIC_URL:-http://localhost:4000}
    environment:
      DATABASE_URL: postgresql://whiteboard:${POSTGRES_PASSWORD}@db:5432/whiteboard
    ports: ["${WEB_HOST_PORT:-3000}:3000"]
    depends_on: { migrate: { condition: service_completed_successfully } }

volumes:
  dbdata:
